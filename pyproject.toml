[project]
name = "nyc-time-travel"
version = "0.1.0"
description = "Neighborhood Time Machine: a lead fans out researchers over NYC historical records, then a writer turns their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=7.0.1",
]
